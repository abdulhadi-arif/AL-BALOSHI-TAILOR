<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALBALOSHI - Premium Tailor</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Outfit',system-ui}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:#111;color:#fff;padding:12px 24px;border-radius:100px;font-size:13px;font-weight:600;z-index:99999;transition:0.4s}
.toast.show{transform:translateX(-50%) translateY(0)}
.card{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,0.06);border:1px solid rgba(0,0,0,0.04)}
.input-fix{background:#fdfbf8;border:1.5px solid rgba(0,0,0,0.06)}
.input-fix:focus,.input-active{border-color:#000!important;background:#fff!important}
#customKeyboard{position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#111;border-radius:28px 28px 0 0;padding:14px 14px 28px;transform:translateY(100%);transition:0.35s}
#customKeyboard.show{transform:translateY(0)}
.kb-btn{background:#222;color:#fff;border-radius:14px;padding:18px 0;font-weight:700;font-size:20px;border:none}
.kb-frac{background:linear-gradient(135deg,#D4AF37,#FFD700);color:#000!important}
.kb-action{background:#333}
.kb-next{background:#fff;color:#000}
.file-wrapper{position:relative;overflow:hidden;border:2px dashed #ccc;border-radius:16px;background:#f9f9f7}
.file-wrapper input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;z-index:10}
.ltr-input{direction:ltr!important;text-align:left!important}
.ltr-display{direction:ltr!important;text-align:center!important}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998;display:none}
.modal-bg.show{display:flex}
.search-input{background:#fff;border:2px solid rgba(0,0,0,0.06)}
#sideMenu{position:fixed;top:0;left:0;width:300px;height:100%;background:#fff;z-index:70;transform:translateX(-100%);transition:0.35s}
#sideMenu.show{transform:translateX(0)}
#sideMenuBg{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:69;display:none}
#sideMenuBg.show{display:block}
.login-bg{background:radial-gradient(ellipse at top, #1a1a1a 0%, #000 60%);position:relative;overflow:hidden}
.login-card{backdrop-filter:blur(20px);background:rgba(255,255,255,0.98);box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.input-stylish{background:#fcf9f6;border:2px solid transparent;transition:0.3s}
.input-stylish:focus{border-color:#D4AF37;background:#fff}
.input-gold{border-color:#D4AF37!important;background:#fff!important}
</style>
<style>
@keyframes goldGlow{0%,100%{box-shadow:0 0 30px rgba(212,175,55,0.4)}50%{box-shadow:0 0 60px rgba(212,175,55,0.7)}}
.logo-glow{animation:goldGlow 3s infinite}
.splash-logo{animation: goldGlow 2s infinite; border:2px solid rgba(212,175,55,0.4)}
</style>
</head>
<body class="bg-[#fcf9f6]">
<div id="toast" class="toast"></div>
<div id="sideMenuBg" onclick="closeSideMenu()"></div>
<div id="sideMenu">
<div class="bg-black text-white p-6 flex justify-between items-center">
<div class="flex items-center gap-3"><div class="w-12 h-12 rounded-[14px] overflow-hidden"><img src="logo.png" class="w-full h-full object-cover"></div><div><div class="font-bold">ALBALOSHI</div><div class="text-[11px] text-white/60">Tailor Master</div></div></div>
<button onclick="closeSideMenu()" class="w-8 h-8 bg-white/10 rounded-full">X</button>
</div>
<div class="p-4 space-y-2">
<button onclick="openTab('home'); closeSideMenu();" class="w-full p-4 rounded-[16px] bg-zinc-50 text-left font-bold">Home</button>
<button onclick="openTab('details'); closeSideMenu();" class="w-full p-4 rounded-[16px] hover:bg-zinc-50 text-left font-bold">New Naap</button>
<button onclick="openTab('settings'); closeSideMenu();" class="w-full p-4 rounded-[16px] hover:bg-zinc-50 text-left font-bold">Setting</button>
<button onclick="directInstall()" class="w-full p-4 rounded-[16px] hover:bg-blue-50 text-left font-bold">Install App</button>
<div class="border-t my-4"></div>
<button onclick="logout()" class="w-full p-4 rounded-[16px] hover:bg-red-50 text-left font-bold text-red-600">Logout</button>
</div>
</div>
<div id="splashScreen" class="min-h-screen bg-black flex flex-col items-center justify-center p-8">
<div class="w-44 h-44 rounded-[32px] overflow-hidden logo-glow splash-logo bg-black"><img src="logo.png" class="w-full h-full object-cover"></div>
<h1 class="text-white text-3xl font-bold mt-10 tracking-widest">ALBALOSHI</h1>
<p class="text-white/50 text-[11px] tracking-[0.3em] mt-2">TAILOR MASTER • PREMIUM</p>
<button id="openAppBtn" class="mt-10 bg-white text-black px-16 py-4 rounded-full font-bold">OPEN</button>
</div>
<div id="loginPage" class="hidden min-h-screen login-bg flex items-center justify-center p-6">
<div class="w-full max-w-sm">
<div class="text-center mb-8"><div class="w-20 h-20 mx-auto rounded-[20px] overflow-hidden border-2 border-yellow-500/30"><img src="logo.png" class="w-full h-full object-cover"></div><h1 class="text-white font-black tracking-[0.3em] text-[22px] mt-5">ALBALOSHI</h1></div>
<div class="login-card rounded-[32px] p-8">
<div class="space-y-4">
<input id="loginPhone" type="tel" placeholder="0300 0000000" class="input-stylish input-gold w-full rounded-[18px] p-4 text-[15px] font-semibold text-center outline-none">
<input id="loginPin" type="tel" maxlength="4" placeholder="PIN - 4 digits" class="input-stylish w-full rounded-[18px] p-4 text-[16px] font-bold text-center tracking-[0.3em] outline-none">
<button id="loginBtn" class="w-full bg-black text-white rounded-[18px] p-[18px] font-black">OPEN →</button>
<div class="text-center"><span id="cloudStatus" class="text-[10px] font-bold">Cloud: Connecting...</span></div>
</div>
</div>
</div>
</div>
<div id="mainApp" class="hidden">
<div class="max-w-md mx-auto bg-[#fcf9f6] min-h-screen pb-20">
<div class="bg-black text-white px-5 py-4 flex items-center gap-3 sticky top-0 z-30">
<div id="topLogoBtn" class="w-11 h-11 rounded-[14px] overflow-hidden border border-yellow-500/30 cursor-pointer shadow-lg"><img src="logo.png" class="w-full h-full object-cover"></div>
<div class="font-bold tracking-widest text-[14px]">ALBALOSHI</div>
<div id="cloudDot" class="ml-auto w-3 h-3 bg-red-500 rounded-full"></div>
</div>
<div id="homeTab" class="p-4 space-y-3">
<div class="search-input rounded-[18px] px-4 py-3 flex items-center gap-3"><span>🔍</span><input id="searchInput" type="text" placeholder="Search..." class="flex-1 bg-transparent outline-none text-[14px]"><button id="clearSearch" class="hidden">X</button></div>
<div id="detailsListHome" class="space-y-3"></div>
</div>
<div id="detailsTab" class="hidden p-4">
<div class="card rounded-[28px] p-6">
<h2 class="font-bold mb-5">New Naap</h2>
<input id="cName" type="text" placeholder="Customer Name" class="input-fix w-full rounded-[16px] p-4 text-[15px] mb-3">
<input id="cMobile" readonly placeholder="Mobile Number" class="measure-input ltr-input input-fix w-full rounded-[16px] p-4 mb-4">
<div id="dynamicNaapFields" class="grid grid-cols-2 gap-2.5 mb-4"></div>
<div class="grid grid-cols-3 gap-2.5 mb-4">
<input id="qty" readonly value="1" class="measure-input input-fix w-full rounded-[14px] p-3.5 text-center font-bold">
<input id="price" readonly placeholder="Total Price" class="measure-input input-fix w-full rounded-[14px] p-3.5 text-center">
<input id="adv" readonly placeholder="Advance" class="measure-input input-fix w-full rounded-[14px] p-3.5 text-center">
</div>
<div class="file-wrapper mb-4 p-4 text-center"><input type="file" id="pics" accept="image/*" multiple><div>📷 Cloth Photo</div></div>
<div id="fileCount" class="hidden mb-2 text-[11px] bg-green-100 py-2 rounded-full font-bold text-center"></div>
<div id="picsPreview" class="grid grid-cols-3 gap-2 mb-3"></div>
<input id="delivery" type="date" class="input-fix w-full rounded-[16px] p-4 text-sm mb-4">
<button id="saveNaap" class="w-full bg-black text-white rounded-[18px] p-4 font-bold text-sm">Save</button>
</div>
</div>
<div id="settingsTab" class="hidden p-4">
<div class="card rounded-[28px] p-6"><div id="naapSettingsList" class="space-y-2 mb-3"></div><div class="flex gap-2"><input id="newNaapName" type="text" placeholder="New Naap" class="input-fix flex-1 rounded-[14px] p-3 text-sm"><button id="addNaapField" class="bg-black text-white rounded-[14px] px-6 text-sm">+ Add</button></div><button id="saveNaapNames" class="w-full bg-black text-white rounded-[14px] p-3 font-bold text-sm mt-4">Save</button></div>
</div>
</div>
</div>
<div id="detailModal" class="modal-bg items-end justify-center p-0"><div class="bg-[#fcf9f6] w-full max-w-md max-h-[90vh] rounded-t-[28px] overflow-y-auto"><div id="modalContent"></div></div></div>
<div id="customKeyboard">
<div class="flex justify-between items-center mb-3"><span class="text-white/60 text-[11px]">TAILOR KEYBOARD</span><span id="kbLabel" class="bg-white/10 text-white text-[11px] px-3 py-1 rounded-full">Lambai</span><button onclick="closeKB()" class="bg-white/10 text-white w-8 h-8 rounded-full">X</button></div>
<div id="kbDisplay" class="bg-white rounded-[16px] p-4 text-center text-xl font-bold mb-3">-</div>
<div class="grid grid-cols-4 gap-2.5">
<button class="kb-btn" onclick="kbPress('1')">1</button><button class="kb-btn" onclick="kbPress('2')">2</button><button class="kb-btn" onclick="kbPress('3')">3</button><button class="kb-btn kb-action" onclick="kbBack()">⌫</button>
<button class="kb-btn" onclick="kbPress('4')">4</button><button class="kb-btn" onclick="kbPress('5')">5</button><button class="kb-btn" onclick="kbPress('6')">6</button><button class="kb-btn kb-action" onclick="kbClear()">Clear</button>
<button class="kb-btn" onclick="kbPress('7')">7</button><button class="kb-btn" onclick="kbPress('8')">8</button><button class="kb-btn" onclick="kbPress('9')">9</button><button class="kb-btn kb-frac" onclick="kbPress('½')">½</button>
<button class="kb-btn kb-frac" onclick="kbPress('.')">.</button><button class="kb-btn" onclick="kbPress('0')">0</button><button class="kb-btn kb-next col-span-2" onclick="kbNext()">Next →</button>
</div>
</div>
<script type="module">
import { db } from "./firebase-config.js";
import { collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
window.cloudDB = db;
window.fbOps = { collection, doc, setDoc, deleteDoc, onSnapshot };
window.cloudConnected = true;
console.log("✅ Firebase file loaded - SEPARATE FILE + LOGO - FIXED");
const dot = document.getElementById('cloudDot');
const status = document.getElementById('cloudStatus');
if(dot){ dot.classList.remove('bg-red-500'); dot.classList.add('bg-green-500'); }
if(status){ status.textContent = "Cloud: Connected ✓ Fixed"; }
</script>
<script>
const $=id=>document.getElementById(id);
let currentUser=null,tempPics=[],editingId=null,activeInput=null,activeDisplay='',deferredPrompt=null;
const key=()=>currentUser?`baloshi_${currentUser}`:'baloshi_main';
const pinKey=p=>`pin_${p}`;
let defaultFields=["Lambai","Chhati","Kamar","Kandha","Asteen","Ghera"];
function showToast(m){let t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500);}
function getFields(){return JSON.parse(localStorage.getItem('custom_fields')||JSON.stringify(defaultFields));}
function saveFields(a){localStorage.setItem('custom_fields',JSON.stringify(a));}
function renderHomeFields(){
let f=getFields();
$('dynamicNaapFields').innerHTML=f.map((n,i)=>`<input readonly dir="ltr" placeholder="${n}" class="measure-input naapInput ltr-input input-fix w-full rounded-[14px] p-3.5 text-[13px] text-center font-bold">`).join('');
bindMeasureInputs();
}
function renderSettingsFields(){let f=getFields();$('naapSettingsList').innerHTML=f.map((n,i)=>`<div class="flex gap-2"><input type="text" value="${n}" data-edit="${i}" class="input-fix flex-1 rounded-[12px] p-3 text-[13px]"><button onclick="delField(${i})" class="w-10 h-10 bg-red-50 text-red-500 rounded-[12px]">X</button></div>`).join('');}
window.delField=(i)=>{let f=getFields();f.splice(i,1);saveFields(f);renderHomeFields();renderSettingsFields();};
function bindMeasureInputs(){document.querySelectorAll('.measure-input').forEach(inp=>{inp.onclick=(e)=>{e.preventDefault();openKB(inp);};});}
function openKB(inputEl){activeInput=inputEl;activeDisplay=inputEl.value||'';$('kbDisplay').textContent=activeDisplay||'-';$('kbLabel').textContent=inputEl.placeholder||'Number';document.querySelectorAll('.measure-input').forEach(e=>e.classList.remove('input-active'));inputEl.classList.add('input-active');$('customKeyboard').classList.add('show');}
function closeKB(){$('customKeyboard').classList.remove('show');if(activeInput) activeInput.classList.remove('input-active');activeInput=null;}
window.kbPress=(val)=>{if(!activeInput) return;activeDisplay+=val;activeInput.value=activeDisplay;$('kbDisplay').textContent=activeDisplay;};
window.kbBack=()=>{if(!activeInput) return;activeDisplay=activeDisplay.slice(0,-1);activeInput.value=activeDisplay;$('kbDisplay').textContent=activeDisplay||'-';};
window.kbClear=()=>{if(!activeInput) return;activeDisplay='';activeInput.value='';$('kbDisplay').textContent='-';};
window.kbNext=()=>{if(!activeInput) return;let all=[...document.querySelectorAll('.measure-input')];let idx=all.indexOf(activeInput);activeInput.value=activeDisplay;activeInput.classList.remove('input-active');if(all[idx+1]){activeInput=all[idx+1];activeDisplay=activeInput.value||'';$('kbDisplay').textContent=activeDisplay||'-';$('kbLabel').textContent=activeInput.placeholder||'Number';activeInput.classList.add('input-active');}else{closeKB();}};
function openSideMenu(){$('sideMenu').classList.add('show');$('sideMenuBg').classList.add('show');}
function closeSideMenu(){$('sideMenu').classList.remove('show');$('sideMenuBg').classList.remove('show');}
$('topLogoBtn').onclick=openSideMenu;
$('openAppBtn').onclick=()=>{$('splashScreen').classList.add('hidden');$('loginPage').classList.remove('hidden');$('loginPage').classList.add('flex');};
$('loginBtn').onclick=()=>{let ph=$('loginPhone').value.replace(/\D/g,'');let pin=$('loginPin').value;if(ph.length<10||pin.length!=4){showToast('Check Number/PIN');return;}let full=ph.slice(-11);let s=localStorage.getItem(pinKey(full));if(s&&s!=pin){showToast('Wrong PIN');return;}if(!s)localStorage.setItem(pinKey(full),pin);currentUser=full;localStorage.setItem('baloshi_user',full);$('loginPage').classList.add('hidden');$('mainApp').classList.remove('hidden');loadAndRender();};
window.logout=()=>{localStorage.removeItem('baloshi_user');location.reload();};
window.openTab=(tab)=>{closeKB();closeSideMenu();$('homeTab').classList.add('hidden');$('detailsTab').classList.add('hidden');$('settingsTab').classList.add('hidden');$(tab+'Tab').classList.remove('hidden');};
$('addNaapField').onclick=()=>{let v=$('newNaapName').value.trim();if(!v)return;let f=getFields();f.push(v);saveFields(f);$('newNaapName').value='';renderHomeFields();renderSettingsFields();};
$('saveNaapNames').onclick=()=>{let arr=[];document.querySelectorAll('[data-edit]').forEach(e=>{if(e.value.trim())arr.push(e.value.trim());});if(arr.length){saveFields(arr);renderHomeFields();renderSettingsFields();showToast('Saved ✓');}};
$('pics').addEventListener('change', function(e){let files=e.target.files; if(!files) return;for(let f of files){let r=new FileReader();r.onload=()=>{tempPics.push(r.result);let div=document.createElement('div');div.className='relative';div.innerHTML=`<img src="${r.result}" class="w-full h-28 object-cover rounded-[14px] border"><button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 bg-red-500 text-white w-6 h-6 rounded-full">X</button>`;$('picsPreview').appendChild(div);$('fileCount').textContent=`${$('picsPreview').children.length} Photo ✓`;$('fileCount').classList.remove('hidden');};r.readAsDataURL(f);}});
function getData(){return JSON.parse(localStorage.getItem(key())||'[]');}
function saveData(a){localStorage.setItem(key(),JSON.stringify(a));}
let cloudCache = [];
let unsub = null;
function startCloudSync(){
  if(!window.cloudDB || !currentUser) return;
  const colRef = window.fbOps.collection(window.cloudDB, `users/${currentUser}/customers`);
  unsub = window.fbOps.onSnapshot(colRef, (snap)=>{
    cloudCache = [];
    snap.forEach(d=> cloudCache.push(d.data()));
    saveData(cloudCache);
    renderCompactCards(cloudCache);
  }, (err)=>{
    console.log("Firestore sync error:", err);
    showToast("Cloud error: " + err.message);
  });
}
async function cloudSaveCustomer(obj){
  if(!window.cloudDB || !currentUser){
    showToast("Local saved - Cloud not ready");
    return;
  }
  try{
    const {pics, ...objWithoutPics} = obj;
    const cloudData = {...objWithoutPics, picsCount: (obj.pics?obj.pics.length:0), hasPics: (obj.pics && obj.pics.length>0), updatedAt: new Date().toISOString()};
    const docRef = window.fbOps.doc(window.cloudDB, `users/${currentUser}/customers`, obj.id);
    await window.fbOps.setDoc(docRef, cloudData);
    showToast("Saved to Cloud ✓");
  }catch(e){ 
    console.error(e);
    showToast("Local saved - " + (e.message || e.code || "error")); 
  }
}
async function cloudDelete(id){
  if(!window.cloudDB || !currentUser) return;
  try{
    const docRef = window.fbOps.doc(window.cloudDB, `users/${currentUser}/customers`, id);
    await window.fbOps.deleteDoc(docRef);
  }catch(e){ console.log(e); }
}
$('searchInput').oninput=(e)=>{let q=e.target.value.toLowerCase().trim();let data=cloudCache.length?cloudCache:getData();if(q){let filtered=data.filter(o=>o.name.toLowerCase().includes(q)||o.mobile.includes(q));renderCompactCards(filtered);}else{renderCompactCards(data);}};
function renderCompactCards(data){
let html=data.slice().reverse().map(o=>{
let baqi=(+o.price||0)-(+o.adv||0);
return `<div onclick="openDetailModal('${o.id}')" class="card rounded-[20px] p-4 flex justify-between items-center"><div class="flex items-center gap-3"><div class="w-11 h-11 bg-black text-white rounded-[12px] flex items-center justify-center font-bold">${o.name.charAt(0).toUpperCase()}</div><div><div class="font-bold text-[14px]">${o.name}</div><div class="text-[11px] text-zinc-500">${o.mobile}</div></div></div><div><a href="tel:${o.mobile}">📞</a> <button onclick="editCustomer('${o.id}')">✏️</button></div></div>`;
}).join('');
$('detailsListHome').innerHTML=html||'<div class="text-center py-20 opacity-40">No Data</div>';
}
window.openDetailModal=(id)=>{let data=cloudCache.length?cloudCache:getData();let o=data.find(x=>x.id==id);if(!o)return;let mHtml=Object.entries(o.measurements||{}).map(([k,v])=>`<div class="bg-[#fdfbf8] rounded-[14px] p-3 text-center border"><div class="text-[10px]">${k}</div><div class="font-bold">${v||'-'}</div></div>`).join('');$('modalContent').innerHTML=`<div class="p-4"><b>${o.name}</b><div>${o.mobile}</div><div class="grid grid-cols-3 gap-2 mt-4">${mHtml}</div><div class="grid grid-cols-2 gap-2 mt-4"><button onclick="editCustomer('${o.id}'); closeModal();" class="bg-black text-white rounded-[14px] py-3">Edit</button><button onclick="deleteCustomer('${o.id}'); closeModal();" class="bg-red-50 text-red-600 rounded-[14px] py-3">Delete</button></div></div>`;$('detailModal').classList.add('show');$('detailModal').style.display='flex';};
window.closeModal=()=>{$('detailModal').classList.remove('show');$('detailModal').style.display='none';};
$('detailModal').onclick=(e)=>{if(e.target===$('detailModal')) closeModal();};
window.editCustomer=(id)=>{let data=cloudCache.length?cloudCache:getData();let o=data.find(x=>x.id==id);if(!o)return;editingId=id;$('cName').value=o.name;$('cMobile').value=o.mobile;$('qty').value=o.qty;$('price').value=o.price;$('adv').value=o.adv;tempPics=o.pics||[];let fields=getFields();document.querySelectorAll('.naapInput').forEach((inp,i)=>{let label=fields[i];inp.value=(o.measurements && o.measurements[label])?o.measurements[label]:'';});openTab('details');};
window.deleteCustomer=async(id)=>{if(!confirm('Delete?'))return;let data=getData().filter(x=>x.id!=id);saveData(data);renderCompactCards(data);await cloudDelete(id);closeModal();showToast('Deleted ✓');};
$('saveNaap').onclick=async()=>{closeKB();let name=$('cName').value,mob=$('cMobile').value;if(!name||!mob){showToast('Name/Number required');return;}let fields=getFields();let meas={};document.querySelectorAll('.naapInput').forEach((inp,i)=>meas[fields[i]]=inp.value);let data=getData();let obj=null;
if(editingId){let idx=data.findIndex(x=>x.id==editingId);if(idx>-1){data[idx].name=name;data[idx].mobile=mob;data[idx].measurements=meas;data[idx].qty=$('qty').value;data[idx].price=$('price').value;data[idx].adv=$('adv').value;data[idx].pics=[...tempPics];obj=data[idx];saveData(data);}editingId=null;}else{obj={id:Date.now().toString(),name,mobile:mob,measurements:meas,qty:$('qty').value,price:$('price').value,adv:$('adv').value,pics:[...tempPics],date:new Date().toLocaleDateString()};data.push(obj);saveData(data);}
if(obj) await cloudSaveCustomer(obj);
$('cName').value='';$('cMobile').value='';document.querySelectorAll('.naapInput').forEach(i=>i.value='');$('qty').value=1;$('price').value='';$('adv').value='';$('pics').value='';$('picsPreview').innerHTML='';tempPics=[];loadAndRender();openTab('home');};
function loadAndRender(){ let data=getData(); renderCompactCards(data); if(currentUser) startCloudSync(); }
let savedUser=localStorage.getItem('baloshi_user');
if(savedUser){currentUser=savedUser;$('splashScreen').classList.add('hidden');$('loginPage').classList.add('hidden');$('mainApp').classList.remove('hidden');loadAndRender();}
renderHomeFields();renderSettingsFields();
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;});
window.directInstall=async()=>{
if(deferredPrompt){deferredPrompt.prompt();let c=await deferredPrompt.userChoice;deferredPrompt=null;}else{showToast('Tap ⋮ → Add to Home Screen');}
};
</script>
</body>
</html>
